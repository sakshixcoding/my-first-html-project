<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sakshi Mittal">
    <meta name="description" content="Contact Information for The Little Taco Shop - Authentic Mexican Tacos">
    <title>Contact - The Little Taco Shop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
<header id="top">
      <h1>Contact Us</h1>
    <nav aria-label="primary-navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about-lts">About LTS</a></li>
            <li><a href="index.html#menu">Our Menu</a></li>
            <li><a href="hours.html">Store Hours</a></li>
        </ul>
    </nav>
    <figure>
        <img src="tacos_close_up_400x260.png" alt="Tacos Close Up" width="400" height="260" class="responsive-img">
        <figcaption>Little Taco Shop Tacos</figcaption>
    </figure>
</header>
<main>
         <div class="main-wrapper">
    <section>
        <h2>Our Contact Form</h2>
    <form action="https://httpbin.org/get" method="get">
        <fieldset>
            <legend>Send Us A Message</legend>
        <p>
             <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="your name">
        </p>
        <p>
                <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="your email" required>
        </p>
        <p>
                <label for="message">Your Message:</label>
                <br>
            <textarea id="message" name="message" rows="10" cols="30" required placeholder="Type your message here..."></textarea>
        </p>
        </fieldset>
        <button type="submit">Send</button>
        <button type="reset">Reset</button>
    </form>
    </section>
    <section>
        <h2>Our Location</h2>
        <address>
            555 Taco Temptation Lane, Suite T <br>
            Kansas City, MO 55555-5555 <br>
            <br>
            Phone: <a href="tel:555-555-5555">555-555-5555</a>
              </address>
              <br>
    <a href="#top">Back to Top</a>
    </section>
    </div>
</main>
<hr>
 <footer>
    <p>Copyright &copy; The Little Taco Shop</p>
    </footer>
</body>
</html>
